name: Update Discord Analytics

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository Analytics
        id: metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.REPO_ANALYTICS_TOKEN }}
          user: prismaudio-official
          repo: spectral-limiter
          
          # Output data internally inside the runner
          config_output: json
          output_action: none
          
          base: traffic
          plugin_traffic: yes

      - name: Push Analytics To Discord
        uses: tsickert/discord-webhook@v6.0.0
        with:
          # Pulls the Webhook URL from your GitHub secrets
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # ⚠️ REPLACE THE DUMMY ID BELOW WITH YOUR ACTUAL DISCORD MESSAGE ID
          message-id: "1548688876812505232"
          avatar-url: "https://github.com"
          username: "PRSM Analytics"
          embed-title: "📊 spectral-limiter Analytics Dashboard"
          embed-description: "Live repository traffic data for the past 14 days."
          embed-color: 5814783
          # Format data cleanly into individual dashboard fields
          embed-f-1-name: "👀 Total Views"
          embed-f-1-value: "${{ fromJson(steps.metrics.outputs.data).traffic.views.count }}"
          embed-f-1-inline: true
          embed-f-2-name: "👤 Unique Visitors"
          embed-f-2-value: "${{ fromJson(steps.metrics.outputs.data).traffic.views.uniques }}"
          embed-f-2-inline: true
          embed-f-3-name: "💾 Total Clones"
          embed-f-3-value: "${{ fromJson(steps.metrics.outputs.data).traffic.clones.count }}"
          embed-f-3-inline: true
          embed-footer-text: "Automatically updates every 6 hours"
