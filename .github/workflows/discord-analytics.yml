name: Update Discord Analytics

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  update-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub Repository Analytics
        id: repo_stats
        run: |
          # Fetch views and clones data using the custom Personal Access Token
          VIEWS_JSON=$(curl -s -H "Authorization: token ${{ secrets.REPO_ANALYTICS_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/views")
          CLONES_JSON=$(curl -s -H "Authorization: token ${{ secrets.REPO_ANALYTICS_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones")
          
          # Fetch general repo info to get an accurate stargazers count safely
          REPO_JSON=$(curl -s -H "Authorization: token ${{ secrets.REPO_ANALYTICS_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}")
          
          # Parse data and ensure 0 values if empty
          TOTAL_VIEWS=$(echo "$VIEWS_JSON" | jq '.count // 0')
          UNIQUE_VIEWS=$(echo "$VIEWS_JSON" | jq '.uniques // 0')
          TOTAL_CLONES=$(echo "$CLONES_JSON" | jq '.count // 0')
          UNIQUE_CLONES=$(echo "$CLONES_JSON" | jq '.uniques // 0')
          STARS=$(echo "$REPO_JSON" | jq '.stargazers_count // 0')
          
          # Export outputs
          echo "views=$TOTAL_VIEWS" >> $GITHUB_OUTPUT
          echo "u_views=$UNIQUE_VIEWS" >> $GITHUB_OUTPUT
          echo "clones=$TOTAL_CLONES" >> $GITHUB_OUTPUT
          echo "u_clones=$UNIQUE_CLONES" >> $GITHUB_OUTPUT
          echo "stars=$STARS" >> $GITHUB_OUTPUT

      - name: Edit Discord Message
        run: |
          # ⚠️ REMEMBER TO REPLACE THIS WITH YOUR ACTUAL DISCORD MESSAGE ID
          MESSAGE_ID="1234567890123456789"
          
          UPDATED_AT=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "📊 Analytics Dashboard",
              "description": "Live traffic statistics for the past 14 days.",
              "color": 5814783,
              "fields": [
                {
                  "name": "👀 Total Views (Unique)",
                  "value": "${{ steps.repo_stats.outputs.views }} (${{ steps.repo_stats.outputs.u_views }})",
                  "inline": true
                },
                {
                  "name": "💾 Total Clones (Unique)",
                  "value": "${{ steps.repo_stats.outputs.clones }} (${{ steps.repo_stats.outputs.u_clones }})",
                  "inline": true
                },
                {
                  "name": "⭐ Stars",
                  "value": "${{ steps.repo_stats.outputs.stars }}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "Last Updated: $UPDATED_AT"
              }
            }]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
               -X PATCH \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}/messages/$MESSAGE_ID"
