name: Save Traffic Data

on:
  schedule:
    - cron: '0 23 * * *' # Runs daily
  workflow_dispatch:

jobs:
  run-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Run GitHub Repo Stats
        uses: jgehrcke/github-repo-stats@RELEASE
        with:
          ghtoken: ${{ secrets.TRAFFIC_TOKEN }}
